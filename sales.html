<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12395f">
<title>Sales &amp; Enquiries · KSK ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#12395f;--navy2:#1b4a78;--gold:#c9a227;--ink:#1d2733;--mut:#6b7a8d;--line:#e5e9ef;--bg:#f4f6f9;--ok:#1a7f4b;--warn:#b8860b;--bad:#b23b3b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-text-size-adjust:100%}
a{color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:230px;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .25s}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{font-size:16px;letter-spacing:.3px;display:block}
.brand span{font-size:11px;color:#c9d4e2;letter-spacing:.5px}
.brand .bar{height:3px;width:52px;background:var(--gold);margin-top:8px;border-radius:2px}
.nav{padding:10px 0;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 18px;color:#dbe4ef;cursor:pointer;font-size:14px;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(201,162,39,.16);border-left-color:var(--gold);color:#fff;font-weight:600}
.nav a .ic{width:18px;text-align:center}
.side .foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#c9d4e2}
.side .foot a{color:#fff;text-decoration:underline;cursor:pointer}
/* main */
.main{margin-left:230px;flex:1;min-width:0}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
.top h1{font-size:18px;font-weight:700;color:var(--navy)}
.top .sp{flex:1}
.who{font-size:13px;color:var(--mut)}
.burger{display:none;font-size:22px;background:none;border:none;color:var(--navy);cursor:pointer}
.wrap{padding:22px;max-width:1180px}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:26px;font-weight:700;color:var(--navy);margin-top:6px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.gold{border-top:3px solid var(--gold)}
/* card / table */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:20px;overflow:hidden}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.card .hd h2{font-size:15px;color:var(--navy)}
.card .hd .sp{flex:1}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{background:#fafbfc;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}
tr:hover td{background:#fbfcfe}
.rt{text-align:right}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--navy);font-weight:600;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.pill.g{background:#e7f4ec;color:var(--ok)}
.pill.y{background:#fbf3dd;color:var(--warn)}
.pill.b{background:#e9eef6;color:var(--navy)}
.pill.r{background:#f7e7e7;color:var(--bad)}
/* buttons/inputs */
.btn{border:none;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);color:#3a2f07}.btn.gold:hover{filter:brightness(1.05)}
.btn.g2{background:#eef1f6;color:var(--navy)}.btn.g2:hover{background:#e2e8f1}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid #cfd8e3;border-radius:8px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy)}
label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.fld{margin-bottom:14px}
.search{max-width:260px}
.muted{color:var(--mut)}
.empty{padding:40px;text-align:center;color:var(--mut)}
/* line editor */
.lrow{display:grid;grid-template-columns:2.4fr .8fr .7fr repeat(3,.7fr) .9fr 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lrow.hd{font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:600;border-bottom:2px solid var(--line)}
.lrow .x{background:#f7e7e7;color:var(--bad);border:none;border-radius:6px;height:32px;cursor:pointer;font-size:16px}
.lrow input{padding:7px 8px}
/* modal */
dialog{border:none;border-radius:14px;padding:0;max-width:760px;width:94vw;box-shadow:0 20px 60px rgba(10,25,50,.3)}
dialog::backdrop{background:rgba(12,28,52,.55)}
.mhd{background:var(--navy);color:#fff;padding:15px 20px;display:flex;align-items:center;gap:12px}
.mhd h3{font-size:16px}.mhd .sp{flex:1}.mhd .cl{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.mbd{padding:20px;max-height:70vh;overflow:auto}
.mft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fafbfc}
.tot{font-size:15px;font-weight:700;color:var(--navy)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;display:none;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
@media(max-width:860px){
 .side{transform:translateX(-100%)}.side.open{transform:none}.main{margin-left:0}
 .burger{display:block}.scrim.show{display:block}.wrap{padding:14px}
 .grid2,.grid3{grid-template-columns:1fr}
 .lrow{grid-template-columns:1fr 1fr;gap:6px}.lrow.hd{display:none}
 .lrow input{width:100%}.search{max-width:none}
 table{display:block;overflow-x:auto;white-space:nowrap}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>KSK ERP</b><span>SALES &amp; ENQUIRIES</span><div class="bar"></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Signed in as <b id="whoName">—</b><br><a id="lo">Log out</a> · <a href="./index.html">Home</a></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="top">
      <button class="burger" id="burger">☰</button>
      <h1 id="ttl">Dashboard</h1>
      <div class="sp"></div>
      <div class="who" id="who"></div>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div id="toast"></div>
<dialog id="dlg"></dialog>

<script>
const SB_URL="https://xpacvqbmpvcwhcimieaq.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwYWN2cWJtcHZjd2hjaW1pZWFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTczNzEsImV4cCI6MjA5OTMzMzM3MX0.88Q1E70WK8kO6osdre4a9yHmTPdAuRYau_ihxD5fl0c";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=t=>(t??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const fmtD=d=>d?new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'}):'';
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const inr2=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function toast(m,ms){const t=$('#toast');t.innerHTML=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms||3200);}
let ME=null, ENQ=[], QTN=[], FUNNEL=[], ORDERS=[], TAB='dash';
const canConvert=()=>ME&&(ME.role==='DIRECTOR'||ME.role==='ADMIN');

const NAV=[
 {k:'dash',ic:'▣',t:'Dashboard'},
 {k:'enq',ic:'◷',t:'Enquiries'},
 {k:'new',ic:'＋',t:'New Enquiry'},
 {k:'qtn',ic:'▤',t:'Quotations'},
];
function drawNav(){
 $('#nav').innerHTML=NAV.map(n=>`<a data-k="${n.k}" class="${n.k===TAB?'on':''}"><span class="ic">${n.ic}</span>${n.t}</a>`).join('');
 document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{go(a.dataset.k);closeSide();});
}
function go(k){TAB=k;drawNav();const t=NAV.find(n=>n.k===k).t;$('#ttl').textContent=t;render[k]();}
function openSide(){$('#side').classList.add('open');$('#scrim').classList.add('show');}
function closeSide(){$('#side').classList.remove('open');$('#scrim').classList.remove('show');}
$('#burger').onclick=openSide;$('#scrim').onclick=closeSide;
$('#lo').onclick=async()=>{await sb.auth.signOut();location.href='./index.html';};

async function q(view,mod){let b=sb.from(view).select('*');if(mod)b=mod(b);const{data,error}=await b;if(error){console.error(view,error);return[];}return data||[];}

/* ============ DATA ============ */
async function loadAll(){
 [ENQ,QTN,FUNNEL,ORDERS]=await Promise.all([
  q('v_enquiries',b=>b.order('enq_date',{ascending:false}).limit(1000)),
  q('v_quotations',b=>b.order('qtn_date',{ascending:false}).limit(1000)),
  q('v_sales_funnel'),
  q('v_orders_pipeline',b=>b.order('created_at',{ascending:false}).limit(50)),
 ]);
}

/* ============ RENDER ============ */
const render={};
render.dash=async()=>{
 $('#view').innerHTML='<div class="empty">Loading…</div>';
 await loadAll();
 const totEnq=ENQ.length, quoted=ENQ.filter(e=>e.quoted).length;
 const totQtn=QTN.length, qval=QTN.reduce((s,x)=>s+Number(x.quotation_amount||0),0);
 const converted=QTN.filter(x=>x.status==='converted').length;
 const qrate=totEnq?Math.round(100*quoted/totEnq):0;
 let h=`<div class="kpis">
  <div class="kpi gold"><div class="l">Enquiries</div><div class="v">${totEnq}</div><div class="s">${quoted} quoted · ${qrate}%</div></div>
  <div class="kpi"><div class="l">Quotations</div><div class="v">${totQtn}</div><div class="s">${inr(qval)} quoted value</div></div>
  <div class="kpi"><div class="l">Converted</div><div class="v">${converted}</div><div class="s">to sales orders</div></div>
  <div class="kpi"><div class="l">Open Quotes</div><div class="v">${totQtn-converted}</div><div class="s">awaiting order</div></div>
 </div>`;
 h+=`<div class="card"><div class="hd"><h2>Pipeline by division</h2></div><table><thead><tr><th>Division</th><th class="rt">Enquiries</th><th class="rt">Quoted</th><th class="rt">Quote rate</th><th class="rt">Quoted value</th></tr></thead><tbody>`;
 h+=FUNNEL.map(f=>`<tr><td>${esc(f.division)}</td><td class="rt">${f.enquiries}</td><td class="rt">${f.enquiries_quoted}</td><td class="rt">${f.quote_rate_pct??0}%</td><td class="rt">${inr(f.quoted_value)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">No data</td></tr>`;
 h+=`</tbody></table></div>`;
 h+=`<div class="card"><div class="hd"><h2>Recent sales orders</h2></div><table><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Buyer PO</th><th class="rt">DP</th></tr></thead><tbody>`;
 h+=(ORDERS||[]).slice(0,15).map(o=>`<tr><td class="mono">${esc(o.po_no)}</td><td>${fmtD(o.created_at?o.created_at.slice(0,10):'')}</td><td>${esc(o.customer)}</td><td>${esc(o.external_po_no||'')}</td><td class="rt">${fmtD(o.dp_current)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">No pipeline orders yet</td></tr>`;
 h+=`</tbody></table></div>`;
 $('#view').innerHTML=h;
};

render.enq=async()=>{
 $('#view').innerHTML='<div class="empty">Loading…</div>';
 if(!ENQ.length) ENQ=await q('v_enquiries',b=>b.order('enq_date',{ascending:false}).limit(1000));
 draw_enq('');
};
function draw_enq(term){
 const t=term.toLowerCase();
 const rows=ENQ.filter(e=>!t||(e.enq_no+' '+e.customer+' '+(e.items||'')).toLowerCase().includes(t));
 let h=`<div class="card"><div class="hd"><h2>Enquiries</h2><div class="sp"></div>
   <input class="search" id="es" placeholder="Search enquiry / customer / item…" value="${esc(term)}">
   <button class="btn gold sm" id="newBtn">＋ New</button></div>
   <table><thead><tr><th>Enquiry</th><th>Date</th><th>Customer</th><th class="rt">Lines</th><th>Status</th><th class="rt">Action</th></tr></thead><tbody>`;
 h+=rows.map(e=>{
   const st=e.quoted?`<span class="pill g">Quoted</span>`:`<span class="pill y">Open</span>`;
   return `<tr><td class="mono">${esc(e.enq_no)}</td><td>${fmtD(e.enq_date)}</td><td>${esc(e.customer)}</td><td class="rt">${e.lines||0}</td><td>${st}</td>
     <td class="rt"><button class="btn sm g2" data-quote="${esc(e.enq_no)}">Quote</button></td></tr>`;
 }).join('')||`<tr><td colspan="6" class="empty">No enquiries</td></tr>`;
 h+=`</tbody></table></div>`;
 $('#view').innerHTML=h;
 $('#es').oninput=ev=>draw_enq(ev.target.value);
 $('#newBtn').onclick=()=>go('new');
 document.querySelectorAll('[data-quote]').forEach(b=>b.onclick=()=>openQuote(b.dataset.quote));
}

/* ---------- New enquiry ---------- */
render.new=()=>{
 $('#view').innerHTML=`
 <div class="card"><div class="hd"><h2>New enquiry</h2></div><div style="padding:20px">
  <div class="grid3">
   <div class="fld"><label>Customer *</label><input id="n_cust" placeholder="Party name"></div>
   <div class="fld"><label>Buyer ref / RFQ no.</label><input id="n_ref" placeholder="optional"></div>
   <div class="fld"><label>Expected by</label><input id="n_exp" type="date" value="${addDays(30)}"></div>
  </div>
  <div class="grid2">
   <div class="fld"><label>Division</label><select id="n_div">
     <option value="KSK Engineering Industries Pvt Ltd > Railway">Railway</option>
     <option value="KSK Engineering Industries Pvt Ltd > Non-Railway">Non-Railway</option></select></div>
   <div class="fld"><label>Notes</label><input id="n_note" placeholder="optional"></div>
  </div>
  <label style="margin-top:6px">Items enquired</label>
  <div id="n_lines"></div>
  <button class="btn g2 sm" id="n_add" style="margin-top:10px">＋ Add item</button>
  <div style="margin-top:18px;display:flex;gap:10px"><button class="btn gold" id="n_save">Save enquiry</button>
   <button class="btn g2" id="n_cancel">Cancel</button></div>
 </div></div>`;
 const box=$('#n_lines');
 const lineHTML=()=>`<div class="lrow"><input placeholder="Item description" data-f="item">
   <input placeholder="Code" data-f="item_code"><input placeholder="Qty" data-f="qty" inputmode="decimal">
   <input placeholder="UOM" data-f="uom" value="Nos"><input placeholder="Group" data-f="item_group" style="grid-column:span 3">
   <span></span><button class="x" title="remove">×</button></div>`;
 function addLine(){const d=document.createElement('div');d.innerHTML=lineHTML();const el=d.firstChild;box.appendChild(el);el.querySelector('.x').onclick=()=>el.remove();}
 addLine();
 $('#n_add').onclick=addLine;
 $('#n_cancel').onclick=()=>go('enq');
 $('#n_save').onclick=async()=>{
   const cust=$('#n_cust').value.trim();
   if(!cust)return toast('Customer is required');
   const lines=[...box.querySelectorAll('.lrow')].map(r=>{const o={};r.querySelectorAll('[data-f]').forEach(i=>o[i.dataset.f]=i.value.trim());return o;}).filter(o=>o.item);
   if(!lines.length)return toast('Add at least one item');
   $('#n_save').disabled=true;
   const{data,error}=await sb.rpc('enq_capture',{p_ref_no:$('#n_ref').value.trim()||null,p_customer:cust,p_division:$('#n_div').value,p_expectation_date:$('#n_exp').value||null,p_notes:$('#n_note').value.trim()||null,p_lines:lines});
   $('#n_save').disabled=false;
   if(error)return toast('Error: '+error.message);
   ENQ=[]; toast('Enquiry '+data+' saved ✓'); go('enq');
 };
};

/* ---------- Quotations tab ---------- */
render.qtn=async()=>{
 $('#view').innerHTML='<div class="empty">Loading…</div>';
 if(!QTN.length) QTN=await q('v_quotations',b=>b.order('qtn_date',{ascending:false}).limit(1000));
 draw_qtn('');
};
function draw_qtn(term){
 const t=term.toLowerCase();
 const rows=QTN.filter(x=>!t||(x.qtn_no+' '+x.customer+' '+(x.enq_no||'')).toLowerCase().includes(t));
 let h=`<div class="card"><div class="hd"><h2>Quotations</h2><div class="sp"></div>
   <input class="search" id="qs" placeholder="Search quote / customer…" value="${esc(term)}"></div>
   <table><thead><tr><th>Quotation</th><th>Date</th><th>Customer</th><th>Enquiry</th><th class="rt">Value</th><th>Status</th><th class="rt">Actions</th></tr></thead><tbody>`;
 h+=rows.map(x=>{
   const st=x.status==='converted'?`<span class="pill b">Ordered</span>`:`<span class="pill y">Open</span>`;
   const conv=(canConvert()&&x.status!=='converted')?`<button class="btn sm gold" data-conv="${esc(x.qtn_no)}">→ Order</button>`:'';
   return `<tr><td class="mono">${esc(x.qtn_no)}</td><td>${fmtD(x.qtn_date)}</td><td>${esc(x.customer)}</td><td class="mono">${esc(x.enq_no||'')}</td>
     <td class="rt">${inr(x.quotation_amount)}</td><td>${st}</td>
     <td class="rt"><button class="btn sm g2" data-print="${esc(x.qtn_no)}">Print</button> ${conv}</td></tr>`;
 }).join('')||`<tr><td colspan="7" class="empty">No quotations</td></tr>`;
 h+=`</tbody></table></div>`;
 $('#view').innerHTML=h;
 $('#qs').oninput=ev=>draw_qtn(ev.target.value);
 document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printQuote(b.dataset.print));
 document.querySelectorAll('[data-conv]').forEach(b=>b.onclick=()=>openConvert(b.dataset.conv));
}

/* ---------- Quote builder modal ---------- */
async function openQuote(enqNo){
 const{data:el}=await sb.from('v_enquiry_lines').select('*').eq('enq_no',enqNo);
 const src=(el||[]);
 const head=src[0]||{};
 const dlg=$('#dlg');
 const rowHTML=(l)=>`<div class="lrow"><input data-f="item" value="${esc(l.item||'')}"><input data-f="item_code" value="${esc(l.item_code||'')}">
   <input data-f="qty" value="${esc(l.qty||'')}" inputmode="decimal"><input data-f="rate" placeholder="rate" inputmode="decimal">
   <input data-f="disc_pct" placeholder="0" value="0" inputmode="decimal"><input data-f="gst_pct" value="18" inputmode="decimal">
   <input data-f="amt" readonly style="background:#f4f6f9;font-weight:600"><button class="x">×</button></div>`;
 dlg.innerHTML=`<div class="mhd"><h3>Quote for ${esc(enqNo)}</h3><div class="sp"></div><button class="cl" onclick="this.closest('dialog').close()">×</button></div>
  <div class="mbd"><div class="muted" style="margin-bottom:10px">Customer: <b>${esc(head.customer||'')}</b></div>
   <div class="lrow hd"><span>Item</span><span>Code</span><span>Qty</span><span>Rate</span><span>Disc%</span><span>GST%</span><span>Amount</span><span></span></div>
   <div id="q_lines"></div>
   <button class="btn g2 sm" id="q_add" style="margin-top:10px">＋ Add line</button>
  </div>
  <div class="mft"><div class="tot" id="q_tot" style="margin-right:auto">Total: ₹0</div>
   <button class="btn g2" onclick="this.closest('dialog').close()">Cancel</button>
   <button class="btn gold" id="q_save">Save quotation</button></div>`;
 const box=dlg.querySelector('#q_lines');
 function wire(el){el.querySelector('.x').onclick=()=>{el.remove();recalc();};el.querySelectorAll('[data-f=qty],[data-f=rate],[data-f=disc_pct]').forEach(i=>i.oninput=recalc);}
 function addRow(l){const d=document.createElement('div');d.innerHTML=rowHTML(l||{});const el=d.firstChild;box.appendChild(el);wire(el);}
 function recalc(){let t=0;box.querySelectorAll('.lrow').forEach(r=>{const g=f=>parseFloat(r.querySelector(`[data-f=${f}]`).value)||0;const a=Math.round(g('qty')*g('rate')*(1-g('disc_pct')/100)*100)/100;r.querySelector('[data-f=amt]').value=a?a.toLocaleString('en-IN'):'';t+=a;});dlg.querySelector('#q_tot').textContent='Total: '+inr2(t)+' + GST';}
 (src.length?src:[{}]).forEach(l=>addRow(l));recalc();
 dlg.querySelector('#q_add').onclick=()=>addRow();
 dlg.querySelector('#q_save').onclick=async()=>{
   const lines=[...box.querySelectorAll('.lrow')].map(r=>{const o={};r.querySelectorAll('[data-f]').forEach(i=>{if(i.dataset.f!=='amt')o[i.dataset.f]=i.value.trim();});return o;}).filter(o=>o.item&&o.rate);
   if(!lines.length)return toast('Add at least one line with a rate');
   dlg.querySelector('#q_save').disabled=true;
   const{data,error}=await sb.rpc('qtn_create',{p_enq_no:enqNo,p_customer:head.customer||null,p_division:head.division||null,p_lines:lines});
   dlg.querySelector('#q_save').disabled=false;
   if(error)return toast('Error: '+error.message);
   dlg.close();QTN=[];ENQ=[];toast('Quotation '+data+' created ✓');go('qtn');
 };
 dlg.showModal();
}

/* ---------- Convert to order modal ---------- */
function openConvert(qtnNo){
 const row=QTN.find(x=>x.qtn_no===qtnNo)||{};
 const dlg=$('#dlg');
 dlg.innerHTML=`<div class="mhd"><h3>Create sales order</h3><div class="sp"></div><button class="cl" onclick="this.closest('dialog').close()">×</button></div>
  <div class="mbd"><div class="muted" style="margin-bottom:12px">From quotation <b class="mono">${esc(qtnNo)}</b> · ${esc(row.customer||'')} · ${inr(row.quotation_amount)}</div>
   <div class="grid2">
    <div class="fld"><label>Buyer PO number</label><input id="c_epo" placeholder="customer's PO no."></div>
    <div class="fld"><label>Buyer PO date</label><input id="c_epod" type="date" value="${today()}"></div>
    <div class="fld"><label>Delivery date (DP)</label><input id="c_dp" type="date" value="${addDays(60)}"></div>
    <div class="fld"><label>Order type</label><select id="c_type"><option value="PVT">Private (PVT)</option><option value="GOVT">Government (GOVT)</option></select></div>
    <div class="fld"><label>Zone / region</label><input id="c_zone" placeholder="optional"></div>
    <div class="fld"><label>Consignee</label><input id="c_cons" placeholder="optional"></div>
   </div>
   <div class="fld"><label>Remarks</label><input id="c_rem" placeholder="optional"></div>
   <div class="muted" style="font-size:12px">A sales order will be created in the Pending Order Register, linked to this quotation &amp; enquiry, and emailed to the sales team.</div>
  </div>
  <div class="mft"><button class="btn g2" onclick="this.closest('dialog').close()">Cancel</button>
   <button class="btn gold" id="c_go">Create &amp; email order</button></div>`;
 dlg.querySelector('#c_go').onclick=async()=>{
   const btn=dlg.querySelector('#c_go');btn.disabled=true;btn.textContent='Creating…';
   const{data,error}=await sb.rpc('qtn_to_order',{p_qtn_no:qtnNo,p_po_type:dlg.querySelector('#c_type').value,p_external_po_no:dlg.querySelector('#c_epo').value.trim()||null,p_external_po_date:dlg.querySelector('#c_epod').value||null,p_dp:dlg.querySelector('#c_dp').value||null,p_zone:dlg.querySelector('#c_zone').value.trim()||null,p_consignee:dlg.querySelector('#c_cons').value.trim()||null,p_remarks:dlg.querySelector('#c_rem').value.trim()||null});
   if(error){btn.disabled=false;btn.textContent='Create & email order';return toast('Error: '+error.message);}
   // fire email (non-blocking)
   let mailMsg='';
   try{const{data:mr}=await sb.functions.invoke('notify-order',{body:data});mailMsg=(mr&&mr.ok)?' · team emailed ✓':' · email pending (set SMTP secret)';}catch(e){mailMsg=' · email not sent';}
   dlg.close();QTN=[];ENQ=[];toast('Sales order '+data.po_no+' created ✓'+mailMsg,4500);go('qtn');
 };
 dlg.showModal();
}

/* ---------- Printable quotation (browser print → PDF) ---------- */
async function printQuote(qtnNo){
 let{data:lines}=await sb.from('v_quotation_lines').select('*').eq('qtn_no',qtnNo).order('line_no');
 lines=lines||[];
 const head=lines[0]||{};
 const rows=lines.map((l,i)=>{
   const amt=l.amount??(Number(l.qty||0)*Number(l.rate||0)*(1-Number(l.disc_pct||0)/100));
   return `<tr><td>${i+1}</td><td style="text-align:left">${esc(l.item||'')}${l.item_code?'<br><span style="color:#888;font-size:11px">'+esc(l.item_code)+'</span>':''}</td>
    <td>${esc(l.qty||'')} ${esc(l.uom||'')}</td><td>${inr2(l.rate)}</td><td>${l.disc_pct||0}%</td><td>${l.gst_pct??18}%</td><td>${inr2(amt)}</td></tr>`;
 }).join('');
 const total=lines.reduce((s,l)=>s+(l.amount??(Number(l.qty||0)*Number(l.rate||0)*(1-Number(l.disc_pct||0)/100))),0);
 const gst=lines.reduce((s,l)=>{const a=l.amount??(Number(l.qty||0)*Number(l.rate||0)*(1-Number(l.disc_pct||0)/100));return s+a*Number(l.gst_pct??18)/100;},0);
 const w=window.open('','_print');
 w.document.write(`<html><head><title>${esc(qtnNo)}</title><style>
  body{font-family:Arial,sans-serif;color:#1d2733;padding:32px;max-width:800px;margin:auto}
  .hd{display:flex;justify-content:space-between;border-bottom:3px solid #c9a227;padding-bottom:14px;margin-bottom:6px}
  .hd h1{color:#12395f;font-size:24px;margin:0}.hd .r{text-align:right;font-size:12px;color:#555}
  .meta{display:flex;justify-content:space-between;margin:18px 0;font-size:13px}
  table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border:1px solid #ccc;padding:8px;text-align:center;font-size:12px}
  th{background:#12395f;color:#fff}tfoot td{font-weight:bold;background:#faf6e9}
  .tot{margin-top:16px;text-align:right;font-size:13px}.tot b{font-size:16px;color:#12395f}
  .ft{margin-top:40px;font-size:11px;color:#777;border-top:1px solid #eee;padding-top:10px}
  @media print{.noprint{display:none}}</style></head><body>
  <div class="hd"><div><h1>KSK Engineering Industries</h1><div style="font-size:12px;color:#555">Railway Track Components</div></div>
   <div class="r"><b>QUOTATION</b><br>${esc(qtnNo)}<br>${fmtD(head.qtn_date)}</div></div>
  <div class="meta"><div><b>To:</b><br>${esc(head.customer||'')}</div><div style="text-align:right"><b>Enquiry:</b> ${esc(head.enq_no||'')}<br><b>Division:</b> ${esc((head.division||'').split('>').pop().trim())}</div></div>
  <table><thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Rate</th><th>Disc</th><th>GST</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="tot">Basic: ${inr2(total)}<br>GST: ${inr2(gst)}<br><b>Grand Total: ${inr2(total+gst)}</b></div>
  <div class="ft">This is a computer-generated quotation from KSK ERP. Prices valid for 30 days unless stated otherwise. E.&amp;O.E.</div>
  <div class="noprint" style="margin-top:20px;text-align:center"><button onclick="window.print()" style="padding:10px 24px;background:#12395f;color:#fff;border:none;border-radius:8px;cursor:pointer">Print / Save as PDF</button></div>
  </body></html>`);
 w.document.close();
}
