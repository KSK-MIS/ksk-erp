<style>
  :root { --navy:#0f2440; --navy2:#16345c; --gold:#c9a227; --bg:#f4f6f9; --ok:#1e7e34; --bad:#b02a37; --warn:#a96b00; }
  * { box-sizing:border-box; margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { background:var(--bg); min-height:100vh; padding-bottom:70px; }
  header { background:var(--navy); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  header a { color:var(--gold); text-decoration:none; font-size:20px; }
  header h1 { font-size:16px; flex:1; } header h1 small { display:block; font-weight:400; opacity:.7; font-size:11px; }
  .chip { background:var(--navy2); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:3px 9px; font-size:11.5px; }
  nav { display:flex; overflow-x:auto; background:#fff; border-bottom:1px solid #e2e7ee; position:sticky; top:53px; z-index:4; }

  main { max-width:560px; margin:0 auto; padding:12px; }
  .card { background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(15,36,64,.08); padding:14px; margin-bottom:10px; }
  .card.clickable { cursor:pointer; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  .t-sub { font-size:12px; color:#778; margin-top:2px; line-height:1.45; }
  .tag { font-size:10.5px; font-weight:700; border-radius:6px; padding:3px 7px; white-space:nowrap; }
  .tag.late { background:#fdeaea; color:var(--bad); } .tag.ok { background:#e6f4ea; color:var(--ok); }
  .tag.soon { background:#fff3d6; color:var(--warn); } .tag.info { background:#e2ecff; color:#1c4fa0; }
  .tag.GOVT { background:#e2ecff; color:#1c4fa0; } .tag.PVT { background:#efe7f7; color:#5b3a86; }
  .tag.closed { background:#fff4e5; color:#8a5a00; border:1px solid #ffd699; }
  button.a { border:0; border-radius:8px; padding:8px 11px; font-size:12.5px; font-weight:600; cursor:pointer; background:#e8ecf2; color:var(--navy); }
  button.a.gold { background:var(--gold); color:var(--navy); } button.a.dark { background:var(--navy); color:#fff; }
  input, select, textarea { width:100%; padding:11px; border:1px solid #cfd6e0; border-radius:9px; font-size:14px; margin-top:6px; background:#fff; }
  label { font-size:11.5px; color:#556; display:block; margin-top:8px; }
  h2 { font-size:13.5px; color:var(--navy); margin:14px 2px 8px; }
  .muted { color:#778; font-size:12.5px; }
  .kpi { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  .kpi div { background:#fff; border-radius:10px; padding:10px; text-align:center; box-shadow:0 1px 3px rgba(15,36,64,.07); }
  .kpi b { font-size:20px; color:var(--navy); display:block; } .kpi span { font-size:10.5px; color:#788; }
  .kpi .alert b { color:var(--bad); }
  .bar { height:6px; background:#eef1f5; border-radius:99px; overflow:hidden; margin-top:7px; }
  .bar i { display:block; height:100%; background:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; color:#788; font-size:10.5px; padding:6px 4px; border-bottom:1px solid #eef; }
  td { padding:8px 4px; border-bottom:1px solid #f2f4f8; }
  td.n, th.n { text-align:right; }
  #toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; display:none; z-index:20; }
  dialog { border:0; border-radius:14px; padding:18px; width:min(94vw,480px); max-height:88vh; }
  dialog::backdrop { background:rgba(15,36,64,.5); }

.tblwrap{ background:#fff; border:1px solid #e2e7ee; border-radius:10px; overflow:auto; max-height:calc(100vh - 250px); margin-bottom:14px; box-shadow:0 1px 3px rgba(15,36,64,.06); }
table.dtbl{ width:100%; border-collapse:collapse; font-size:13px; }
table.dtbl thead th{ position:sticky; top:0; background:#eef2f7; color:#3a4a5e; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; text-align:left; padding:9px 12px; border-bottom:2px solid #d6dee8; white-space:nowrap; z-index:1; user-select:none; }
table.dtbl thead th.n{ text-align:right; }
table.dtbl thead th:hover{ background:#e4eaf2; }

table.dtbl td b{ color:#182b45; }

<script>
const sb = supabase.createClient("https://xpacvqbmpvcwhcimieaq.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwYWN2cWJtcHZjd2hjaW1pZWFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTczNzEsImV4cCI6MjA5OTMzMzM3MX0.88Q1E70WK8kO6osdre4a9yHmTPdAuRYau_ihxD5fl0c"); // public by design; RLS is the guard
const $ = s => document.querySelector(s);
let ME = null, TAB = 'pending', REG = [], REGF = 'all';
const esc = t => (t??'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d ? new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'}) : '—';
const today = () => new Date().toISOString().slice(0,10);
const num = n => (n==null||n==='') ? '—' : Number(n).toLocaleString('en-IN');
const money = n => (n==null) ? '—' : '₹' + Number(n).toLocaleString('en-IN',{maximumFractionDigits:0});
const days = d => d ? Math.round((new Date(d+'T00:00') - new Date(today()+'T00:00'))/864e5) : null;
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }
async function rpc(fn, args){ const {data,error} = await sb.rpc(fn,args); if(error){ toast(error.message); throw error; } return data; }
async function q(view, mod){ let x = sb.from(view).select('*'); if(mod) x = mod(x); const {data,error} = await x; if(error){ toast(error.message); return []; } return data; }
const isAdmin = () => ME.role==='ADMIN' || ME.role==='DIRECTOR';
// ---- module-wise access gate (shared across ERP pages) ----
function kskGate(mod){
  var sup=ME&&ME.is_super_admin, mods=(ME&&ME.permissions&&ME.permissions.modules)||[];
  document.querySelectorAll('.nv-a').forEach(function(a){
    var k=(a.getAttribute('href')||'').replace(/^\.?\//,'').replace('.html','');
    if(k&&k!=='index'&&!(sup||mods.indexOf(k)!==-1)) a.style.display='none';
  });
  var ok=sup||mods.indexOf(mod)!==-1;
  if(!ok){
    var h=document.querySelector('#main')||document.querySelector('#view')||document.querySelector('main');
    if(h) h.innerHTML='<div style="max-width:520px;margin:44px auto;padding:22px 24px;border:1px solid #d8dee6;border-left:4px solid #c9a227;border-radius:6px;background:#fff">'+
      '<h3 style="margin:0 0 6px;color:#12395f;font-size:16px">Access not enabled</h3>'+
      '<p style="margin:0;color:#556;font-size:14px">Your account doesn’t have access to this module. Please contact the Director if you need it.</p></div>';
  }
  return ok;
}

/* ===== KSK sortable dense-table engine ===== */
const KSKT={};
function kskDraw(id){
  const t=KSKT[id]; if(!t)return; const tb=document.querySelector('#'+id+' tbody'); if(!tb)return;
  let rows=t.rows.slice(); const sc=t.cols[t.sort.col];
  if(sc){ rows.sort((a,b)=>{
    let x=sc.sort?sc.sort(a):(sc.get?sc.get(a):''), y=sc.sort?sc.sort(b):(sc.get?sc.get(b):'');
    if(sc.num){ x=(x==null||x==='')?-Infinity:Number(x); y=(y==null||y==='')?-Infinity:Number(y); return (x-y)*t.sort.dir; }
    return String(x==null?'':x).localeCompare(String(y==null?'':y),undefined,{numeric:true})*t.sort.dir;
  }); }
  tb.innerHTML = rows.length ? rows.map(r=>{
    const oc=t.onRow?` class="rowc" onclick="${t.onRow(r)}"`:'';
    return '<tr'+oc+'>'+t.cols.map(c=>`<td class="${c.num?'n':''} ${c.cls?c.cls(r):''}">${c.cell?c.cell(r):esc(c.get?c.get(r):'')}</td>`).join('')+'</tr>';
  }).join('') : `<tr><td colspan="${t.cols.length}" style="text-align:center;color:#889;padding:16px">Nothing to show.</td></tr>`;
  t.cols.forEach((c,i)=>{ const s=document.querySelector('#'+id+' th[data-c="'+i+'"] .sarr'); if(s) s.textContent=t.sort.col===i?(t.sort.dir>0?'▲':'▼'):''; });
}
function kskSortBy(id,i){ const t=KSKT[id]; if(!t||t.cols[i].noSort)return; if(t.sort.col===i)t.sort.dir*=-1; else{t.sort.col=i;t.sort.dir=t.cols[i].num?-1:1;} kskDraw(id); }
function kskTable(id,cols,rows,opts){
  opts=opts||{}; KSKT[id]={cols,rows,onRow:opts.onRow,sort:{col:(opts.sortCol==null?-1:opts.sortCol),dir:opts.sortDir||1}};
  const head=cols.map((c,i)=>`<th data-c="${i}" class="${c.num?'n':''}" ${c.noSort?'':`onclick="kskSortBy('${id}',${i})" style="cursor:pointer"`} title="${c.noSort?'':'Click to sort'}">${esc(c.label)} <span class="sarr"></span></th>`).join('');
  setTimeout(()=>kskDraw(id),0);
  return `<div class="tblwrap"><table class="dtbl" id="${id}"><thead><tr>${head}</tr></thead><tbody></tbody></table></div>`;
}

const TABS = [['pending','Pending'],['ext','Extensions'],['reg','Register'],['new','New PO'],['value','Value']];
function drawNav(){
  const t = isAdmin() ? TABS : TABS.filter(x=>!['new','value'].includes(x[0]));
  $('#nav').innerHTML = t.map(([id,l])=>`<button class="${TAB===id?'on':''}" onclick="go('${id}')">${l}</button>`).join('');
}
function go(t){ TAB=t; drawNav(); render[t](); }

// ---- register filter ----
function regFilter(f){ REGF=f; regDraw(); }
function regDraw(){
  const term = ($('#rq')?.value || '').trim().toLowerCase();
  const hit = p => !term || [p.customer,p.po_no,p.external_po_no,p.zone,p.consignee]
      .some(v => (v||'').toString().toLowerCase().includes(term));
  const pass = p => REGF==='all' ? true
    : REGF==='open'    ? p.pending_lines>0
    : REGF==='late'    ? p.overdue_lines>0
    : REGF==='govt'    ? p.po_type==='GOVT'
    : REGF==='pvt'     ? p.po_type==='PVT'
    : REGF==='derived' ? derived(p) : true;
  ['all','open','late','govt','pvt','der'].forEach(k=>{
    const b=$('#f-'+k); if(b) b.classList.remove('dark');
  });
  const btn = $('#f-' + (REGF==='derived'?'der':REGF)); if(btn) btn.classList.add('dark');
  const list = REG.filter(p=>hit(p)&&pass(p));
  const cols=[
    {label:'Customer', cls:()=>'wrap', get:p=>p.customer,
      cell:p=>`<b>${esc(p.customer)}</b><span class="s2">${esc(p.po_no)} · ext ${esc(p.external_po_no||'—')}</span>`},
    {label:'Zone', get:p=>p.zone||'', cell:p=>esc(p.zone||'—')},
    {label:'Consignee', cls:()=>'wrap', get:p=>p.consignee||'', cell:p=>esc(p.consignee||'—')},
    {label:'DP', sort:p=>p.dp_current||'9999-99-99', cell:p=>fmt(p.dp_current)},
    {label:'Lines open', num:true, sort:p=>p.pending_lines, cell:p=>`${p.pending_lines}/${p.line_count}`},
    {label:'Overdue', num:true, get:p=>p.overdue_lines, cell:p=>p.overdue_lines>0?`<span class="tag late">${p.overdue_lines}</span>`:'—'},
    {label:'Type', get:p=>p.po_type, cell:p=>`<span class="tag ${p.po_type}">${p.po_type}</span>${derived(p)?' <span class="tag" style="background:#fff4e5;color:#8a5a00">SALES</span>':''}`},
    {label:'Status', get:p=>p.status, cell:p=>p.status!=='OPEN'?`<span class="tag info">${esc(p.status)}</span>`:'<span class="tag ok">OPEN</span>'}
  ];
  $('#reglist').innerHTML =
    `<p class="muted" style="margin:8px 4px">Showing ${list.length} of ${REG.length} POs · click a column to sort</p>` +
    kskTable('t-reg', cols, list, {onRow:p=>`openPO('${p.id}')`, sortCol:3, sortDir:1});
}

// ---- cards ----
function dpTag(dp, complete){
  if(complete) return '<span class="tag ok">COMPLETE</span>';
  const d = days(dp);
  if(d===null) return '<span class="tag info">NO DP</span>';
  if(d < 0) return `<span class="tag late">OVERDUE ${-d}d</span>`;
  if(d <= 30) return `<span class="tag soon">DUE ${d}d</span>`;
  return `<span class="tag ok">${d}d left</span>`;
}
const derived = p => p.qty_basis === 'DISPATCH_DERIVED';
function poCard(p){
  const worst = p.overdue_lines>0;
  return `<div class="card clickable" onclick="openPO('${p.id}')"><div class="row">
    <div class="grow">
      <div class="t-title">${esc(p.customer)}</div>
      <div class="t-sub">${p.po_no} · ext ${esc(p.external_po_no||'—')}${p.zone?' · '+esc(p.zone):''}
        <br>${esc(p.consignee||'consignee not set')} · DP ${fmt(p.dp_current)}
        ${p.inspection_agency?'<br>Inspection: '+esc(p.inspection_agency):''}</div>
    </div>
    <div style="text-align:right">
      <span class="tag ${p.po_type}">${p.po_type}</span><br>
      <span style="font-size:11px;color:#889">${p.pending_lines}/${p.line_count} lines open</span>
    </div></div>
    <div class="row" style="margin-top:8px">
      ${derived(p)
        ? `<span class="tag" style="background:#fff4e5;color:#8a5a00">FY26-27 SALES RECORD — qty from dispatches, not a PO</span>`
        : (worst?`<span class="tag late">${p.overdue_lines} line${p.overdue_lines>1?'s':''} past DP</span>`:dpTag(p.dp_current, p.pending_lines==0))}
      ${p.status!=='OPEN'?`<span class="tag info">${p.status}</span>`:''}
    </div></div>`;
}
function lineRow(l, admin){
  const pct = l.qty_ordered>0 ? Math.min(100, Math.round(100*l.qty_dispatched/l.qty_ordered)) : 0;
  // A closed line still owes a balance on paper. Show it, and show why it's settled —
  // a line that reads "72,612 owed" with no explanation is worse than one that's late.
  return `<div class="card" style="box-shadow:none;border:1px solid ${l.closed?'#ffd699':'#eef1f5'};margin-bottom:8px;${l.closed?'background:#fffdf8':''}">
    <div class="row"><div class="grow">
      <div class="t-title">${esc(l.item)}</div>
      ${l.consignee?`<div class="t-sub" style="color:#334">▸ ${esc(l.consignee)}${l.schedule_sr?` <span class="muted">Sr ${esc(l.schedule_sr)}</span>`:''}</div>`:''}
      <div class="t-sub">${esc(l.drawing_no||'no drawing')} · ${num(l.qty_dispatched)} / ${num(l.qty_ordered)} ${esc(l.uom||'')}
        · bal <b>${num(l.balance)}</b><br>DP ${fmt(l.dp_current)}${l.dp_current!==l.dp_original?` <span class="muted">(orig ${fmt(l.dp_original)})</span>`:''}
        · invoice: ${esc(l.invoice_status||'PENDING')}</div>
    </div>${l.closed?'<span class="tag closed">CLOSED</span>':dpTag(l.dp_current, l.complete)}</div>
    ${l.closed?`<div class="t-sub" style="color:#6b4700;background:#fff4e5;border:1px solid #ffd699;border-radius:8px;padding:8px;margin-top:8px">
      <b>Settled without a dispatch record.</b> ${esc(l.closed_reason||'')}
      ${l.closed_by_name?`<br><span class="muted">Closed by ${esc(l.closed_by_name)} · ${fmt(l.closed_on)}</span>`:''}</div>`
    :`<div class="bar"><i style="width:${pct}%"></i></div>`}
    ${admin?`<div class="row" style="margin-top:9px">
      ${l.closed?`<button class="a" onclick="reopenLine('${l.id}')">Re-open</button>`
      :`<button class="a gold" onclick="addDispatch('${l.id}', ${l.balance})">+ Dispatch</button>
        <button class="a" onclick="extendDP(null,'${l.id}','${esc(l.item)}')">⟳ DP extension</button>
        <button class="a" onclick="invoiceSet('${l.id}')">Invoice…</button>
        ${!l.complete?`<button class="a" onclick="closeLine('${l.id}','${esc(l.item)}')">Close…</button>`:''}`}
    </div>`:''}</div>`;
}
// Closing is not deleting. It records that the line is settled and why, keeps the
// balance visible, and can be undone.
function closeLine(lineId, name){
  $('#dlg').innerHTML = `<div class="t-title">Close this line without a dispatch</div>
    <p class="muted" style="margin-top:3px">${esc(name)}</p>
    <p class="muted" style="margin-top:6px">Use this when the material went out but the proof sits outside what this system holds — a delivery before 1 Apr 2026, for instance. The balance stays on the line; the reason goes on the record.</p>
    <label>Why is this settled?</label>
    <textarea id="c-why" rows="3" placeholder="e.g. Delivered Dec 2025; DP predates the FY window."></textarea>
    <label>Settled on</label><input id="c-on" type="date" value="${today()}">
    <div class="row" style="margin-top:12px"><button class="a gold grow" id="c-ok">Close line</button>
      <button class="a" onclick="dlg.close()">Cancel</button></div>`;
  $('#c-ok').onclick = async ()=>{
    if(!$('#c-why').value.trim()) return toast('A closure needs a reason');
    await rpc('line_close', { p_line_id:lineId, p_reason:$('#c-why').value.trim(), p_on:$('#c-on').value||null });
    toast('Line closed'); $('#dlg').close(); render[TAB]();
  };
  $('#dlg').showModal();
}
async function reopenLine(lineId){
  if(!confirm('Re-open this line? It goes back into the pending and LD lens.')) return;
  await rpc('line_reopen', { p_line_id:lineId });
  toast('Re-opened'); $('#dlg').close(); render[TAB]();
}

// ---- pending (line-level sortable table) ----
let PEND_LINES=[], PENDF='all';
function pendFilter(f){
  PENDF=f;
  ['all','od','soon','nodp'].forEach(k=>{ const b=$('#pf-'+k); if(b) b.classList.remove('dark'); });
  const ab=$('#pf-'+f); if(ab) ab.classList.add('dark');
  let rows=PEND_LINES;
  if(f==='od') rows=rows.filter(l=>l.dp_current && l.dp_current<today());
  else if(f==='soon') rows=rows.filter(l=>l._d!==null && l._d>=0 && l._d<=30);
  else if(f==='nodp') rows=rows.filter(l=>!l.dp_current);
  const cols=[
    {label:'Customer', cls:()=>'wrap', get:l=>l._po.customer,
      cell:l=>`<b>${esc(l._po.customer)}</b><span class="s2">${esc(l._po.po_no)}${l._po.zone?' · '+esc(l._po.zone):''}${l._po.consignee?' · '+esc(l._po.consignee):''}</span>`},
    {label:'Item', cls:()=>'wrap', get:l=>l.item,
      cell:l=>`${esc(l.item)}<span class="s2">${esc(l.drawing_no||'no drawing')}${l.schedule_sr?' · Sr '+esc(l.schedule_sr):''}</span>`},
    {label:'Balance', num:true, get:l=>l.balance,
      cell:l=>`<b>${num(l.balance)}</b> ${esc(l.uom||'')}<span class="s2">of ${num(l.qty_ordered)}</span>`},
    {label:'DP', sort:l=>l.dp_current||'9999-99-99', cell:l=>fmt(l.dp_current)},
    {label:'Status', sort:l=>l._d==null?1e9:l._d, cell:l=>dpTag(l.dp_current,false)},
    {label:'Type', get:l=>l._po.po_type, cell:l=>`<span class="tag ${l._po.po_type}">${l._po.po_type}</span>`}
  ];
  $('#pendtbl').innerHTML = kskTable('t-pend', cols, rows, {onRow:l=>`openPO('${l._po.id}')`, sortCol:4, sortDir:1});
}

      ], rows, {sortCol:3, sortDir:-1})}`;
  }
};

        ${admin?` <button class="a" style="padding:2px 7px;font-size:11px" onclick="linkQtn('${p.id}','${esc(p.qtn_no||'')}')">${p.qtn_no?'change':'tag quotation'}</button>`:''}
        </div></div>
      <span class="tag ${p.po_type}">${p.po_type}</span></div>
    ${derived(p)?`<div class="card" style="box-shadow:none;background:#fff4e5;border:1px solid #ffd699;margin-top:10px">

// ---- actions (every write goes through a guarded RPC) ----
async function createPO(){
  const type = $('#p-type').value, cust = $('#p-cust').value.trim();
  if(!cust) return toast('Customer required');
  if(type==='GOVT' && !$('#p-zone').value.trim()) return toast('Railway zone required for a Govt PO');
  const no = await rpc('po_create', { p_type:type, p_customer:cust,
    p_ext_no:$('#p-ext').value||null, p_ext_date:$('#p-extd').value||null,
    p_zone:type==='GOVT'?$('#p-zone').value:null, p_consignee:$('#p-cons').value||null,
    p_inspection:$('#p-insp').value||null, p_dp:$('#p-dp').value||null,
    p_remarks:$('#p-rem').value||null });
  toast('Created '+no); go('reg');
}

  $('#dlg').innerHTML = `<div class="t-title">Record dispatch</div>
    <p class="muted" style="margin-top:3px">Balance on this line: <b>${num(balance)}</b>. The database refuses more than the balance.</p>
    <div class="row"><div class="grow"><label>Date</label><input id="d-date" type="date" value="${today()}"></div>
      <div class="grow"><label>Qty</label><input id="d-qty" type="number" step="0.01" max="${balance}"></div></div>
    <label>Reference (invoice / RR / challan)</label><input id="d-ref" placeholder="Optional">
    <div class="row" style="margin-top:12px"><button class="a gold grow" id="d-ok">Save dispatch</button>
      <button class="a" onclick="dlg.close()">Cancel</button></div>`;
  $('#d-ok').onclick = async ()=>{
    const qv = Number($('#d-qty').value); if(!qv) return toast('Qty required');
    await rpc('dispatch_add', { p_line_id:lineId, p_date:$('#d-date').value, p_qty:qv, p_ref:$('#d-ref').value||null });
    toast('Dispatch recorded'); $('#dlg').close(); render[TAB]();
  };
  $('#dlg').showModal();
}
// Apply for an extension. LD terms are NOT set here — they arrive with the grant letter.
function extendDP(poId, lineId, what){
  $('#dlg').innerHTML = `<div class="t-title">Apply for DP extension — ${esc(what)}</div>
    <p class="muted" style="margin-top:3px">This logs the application only. The DP does not move until the extension is granted — record the grant (and any LD clause) when the letter arrives.</p>
    <div class="row"><div class="grow"><label>Applied on</label><input id="x-app" type="date" value="${today()}"></div>
      <div class="grow"><label>DP asked for</label><input id="x-dp" type="date"></div></div>
    <label>Remarks (letter ref, reason…)</label><textarea id="x-rem" rows="2"></textarea>
    <div class="row" style="margin-top:12px"><button class="a gold grow" id="x-ok">Log application</button>
      <button class="a" onclick="dlg.close()">Cancel</button></div>`;
  $('#x-ok').onclick = async ()=>{
    if(!$('#x-dp').value) return toast('Enter the DP you are asking for');
    await rpc('dp_extend', { p_po_id:poId, p_line_id:lineId, p_applied:$('#x-app').value||null,
      p_granted:null, p_revised:$('#x-dp').value, p_remarks:$('#x-rem').value||null });
    toast('Application logged — DP unchanged until granted');
    $('#dlg').close(); render[TAB]();
  };
  $('#dlg').showModal();
}
// Record the grant. This is where LD terms are captured and the DP finally moves.
function grantExt(extId, askedLabel, askedIso){
  $('#dlg').innerHTML = `<div class="t-title">Record extension grant</div>
    <p class="muted" style="margin-top:3px">You asked for <b>${esc(askedLabel)}</b>. Enter what was actually granted. Granting moves the working DP.</p>
    <div class="row"><div class="grow"><label>Granted on</label><input id="g-on" type="date" value="${today()}"></div>
      <div class="grow"><label>Revised DP granted</label><input id="g-dp" type="date" value="${esc(askedIso||'')}"></div></div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px">
      <input id="g-ld" type="checkbox" style="width:auto" onchange="document.getElementById('ld-wrap').style.display=this.checked?'block':'none'">
      Granted <b>with LD</b> (liquidated damages)</label>
    <div id="ld-wrap" style="display:none;border-left:3px solid #e5484d;padding-left:10px;margin-top:8px">
      <div class="row"><div class="grow"><label>LD rate (% per week)</label><input id="g-rate" type="number" step="0.01" placeholder="e.g. 0.5"></div>
        <div class="grow"><label>Cap (% max)</label><input id="g-cap" type="number" step="0.01" placeholder="e.g. 10"></div></div>
      <label>Clause reference</label><input id="g-cl" placeholder="e.g. IRS Conditions of Contract, cl. 0702">
      <p class="muted" style="margin:6px 0 0">Exposure accrues from the <b>original</b> DP on the undelivered balance, capped.</p>
    </div>
    <label>Remarks (letter ref…)</label><textarea id="g-rem" rows="2"></textarea>
    <div class="row" style="margin-top:12px"><button class="a dark grow" id="g-ok">Record grant</button>
      <button class="a" onclick="dlg.close()">Cancel</button></div>`;
  $('#g-ok').onclick = async ()=>{
    const ld = $('#g-ld').checked;
    if(!$('#g-dp').value) return toast('Enter the revised DP that was granted');
    if(ld && (!$('#g-rate').value || !$('#g-cap').value)) return toast('LD needs both a rate and a cap');
    await rpc('dp_extension_grant', { p_ext_id:extId, p_granted:$('#g-on').value, p_revised:$('#g-dp').value,
      p_ld_applicable:ld, p_ld_rate:ld?Number($('#g-rate').value):null, p_ld_cap:ld?Number($('#g-cap').value):null,
      p_ld_clause:ld?($('#g-cl').value||null):null, p_remarks:$('#g-rem').value||null });
    toast(ld ? 'Granted with LD — DP moved, exposure now tracked' : 'Granted clean — DP moved');
    $('#dlg').close(); render[TAB]();
  };
  $('#dlg').showModal();
}
function invoiceSet(lineId){
  $('#dlg').innerHTML = `<div class="t-title">Invoice / receipt status</div>
    <p class="muted" style="margin-top:3px">This lags the dispatch — a line can be fully dispatched and still unpaid.</p>
    <select id="i-st"><option value="PENDING">Pending</option><option value="INVOICED">Invoiced</option>
      <option value="RECEIVED">Payment received</option></select>
    <div class="row" style="margin-top:12px"><button class="a gold grow" id="i-ok">Save</button>
      <button class="a" onclick="dlg.close()">Cancel</button></div>`;
  $('#i-ok').onclick = async ()=>{
    await rpc('line_invoice_set', { p_line_id:lineId, p_status:$('#i-st').value });
    toast('Saved'); $('#dlg').close(); render[TAB]();
  };
  $('#dlg').showModal();
}
// Tag the quotation this PO was won against. Without this, no honest win rate exists.
async function linkQtn(poId, current){
  const qs = await q('v_quotations', x=>x.order('qtn_date',{ascending:false}));
  $('#dlg').innerHTML = `<div class="t-title">Which quotation won this order?</div>
    <p class="muted" style="margin-top:3px">This is the link the Sales funnel needs. Leave blank if the order came in without a quotation from us.</p>
    <label>Quotation</label>
    <select id="lq"><option value="">— none / not known —</option>
      ${qs.map(x=>`<option value="${esc(x.qtn_no)}" ${x.qtn_no===current?'selected':''}>${esc(x.qtn_no)} · ${esc((x.customer||'').slice(0,32))} · ${fmt(x.qtn_date)}</option>`).join('')}
    </select>
    <div class="row" style="margin-top:12px"><button class="a gold grow" id="lq-ok">Save</button>
      <button class="a" onclick="dlg.close()">Cancel</button></div>`;
  $('#lq-ok').onclick = async ()=>{
    await rpc('po_link_quotation', { p_po_id:poId, p_qtn_no:$('#lq').value || null });
    toast('Linked'); $('#dlg').close(); render[TAB]();
  };
  $('#dlg').showModal();
}
async function closePO(id){
  if(!confirm('Close this PO? Open lines stay on record; the PO leaves the pending lens.')) return;
  await rpc('po_close', { p_po_id:id }); toast('PO closed'); $('#dlg').close(); go('reg');
}

// ---- boot ----
(async ()=>{
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ location.href = './index.html'; return; }
  const {data,error} = await sb.rpc('my_profile');
  if(error || !data?.length){ location.href = './index.html'; return; }
  ME = data[0];
  if(!kskGate('orders')){ $('#who').textContent = ME.full_name.split(' ')[0] + ' · ' + ME.role; return; }
  $('#who').textContent = ME.full_name.split(' ')[0] + ' · ' + ME.role;
  drawNav(); render.pending();
})();
</script>
</body>
